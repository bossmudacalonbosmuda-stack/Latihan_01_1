<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Latihan 01 - 01</title>
</head>
<body>
    <h1>Pengenalan HTML</h1>
    <p>
        <font face="Arial" color="blue" size="4">
            Ini adalah paragraf pertama yang menggunakan penataan tag <b>font</b> dengan atribut <i>face</i> (jenis font) dan <i>color</i> (warna teks).
        </font>
    </p>
    <p>
        <font face="Courier New" color="green">
            Pemrograman web sangat menyenangkan dan mudah dipelajari.
        </font>
    </p>
</body>
</html>
